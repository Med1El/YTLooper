<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Looper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #1a1a1a;
      --border:  #2e2e2e;
      --accent:  #ff4444;
      --accent2: #4488ff;
      --text:    #e8e8e8;
      --muted:   #888;
      --radius:  8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
    h1 span { color: var(--text); }

    /* ── URL bar ── */
    .url-row {
      display: flex;
      width: 100%;
      max-width: 800px;
      gap: 8px;
    }
    .url-row input {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    .url-row input:focus { border-color: var(--accent2); }
    .url-row button {
      padding: 10px 20px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent2);
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .url-row button:hover { opacity: .85; }

    /* ── Video player wrapper ── */
    #player-wrap {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      transition: height .3s, aspect-ratio .3s;
    }
    /* In audio mode the iframe is shrunken to 1×1 and hidden — audio keeps playing */
    #player-wrap.audio-mode {
      aspect-ratio: unset;
      height: 1px;        /* non-zero so the iframe stays alive */
      overflow: hidden;
      pointer-events: none;
    }
    #player-wrap iframe,
    #player-wrap > div { width: 100% !important; height: 100% !important; }

    /* ── Audio artwork panel (shown only in audio mode) ── */
    #audio-panel {
      display: none;
      width: 100%;
      max-width: 800px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      align-items: center;
      gap: 20px;
    }
    #audio-panel.visible { display: flex; }

    #audio-thumb {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: #111;
    }
    #audio-thumb-ph {
      width: 80px;
      height: 80px;
      border-radius: 6px;
      background: #222;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .audio-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #audio-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Animated waveform bars */
    .waveform {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 28px;
    }
    .waveform .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--accent2);
      opacity: .55;
      transform-origin: bottom;
    }
    .waveform.playing .bar { animation: wave .8s ease-in-out infinite alternate; opacity: 1; }
    /* staggered heights / delays */
    .waveform .bar:nth-child(1)  { height:40%; animation-delay:.00s }
    .waveform .bar:nth-child(2)  { height:70%; animation-delay:.10s }
    .waveform .bar:nth-child(3)  { height:55%; animation-delay:.05s }
    .waveform .bar:nth-child(4)  { height:85%; animation-delay:.20s }
    .waveform .bar:nth-child(5)  { height:45%; animation-delay:.15s }
    .waveform .bar:nth-child(6)  { height:90%; animation-delay:.25s }
    .waveform .bar:nth-child(7)  { height:60%; animation-delay:.08s }
    .waveform .bar:nth-child(8)  { height:75%; animation-delay:.18s }
    .waveform .bar:nth-child(9)  { height:50%; animation-delay:.30s }
    .waveform .bar:nth-child(10) { height:80%; animation-delay:.12s }
    .waveform .bar:nth-child(11) { height:35%; animation-delay:.22s }
    .waveform .bar:nth-child(12) { height:65%; animation-delay:.07s }
    .waveform .bar:nth-child(13) { height:95%; animation-delay:.28s }
    .waveform .bar:nth-child(14) { height:50%; animation-delay:.16s }
    .waveform .bar:nth-child(15) { height:72%; animation-delay:.04s }
    @keyframes wave {
      from { transform: scaleY(.35); }
      to   { transform: scaleY(1.0); }
    }

    /* ── Progress bar ── */
    .progress-section { width: 100%; max-width: 800px; }
    .progress-track {
      position: relative;
      height: 36px;
      cursor: pointer;
      user-select: none;
    }
    .progress-track .track-bg {
      position: absolute; top: 50%; transform: translateY(-50%);
      left: 0; right: 0; height: 6px;
      background: var(--border); border-radius: 3px;
    }
    .progress-track .track-played {
      position: absolute; top: 50%; transform: translateY(-50%);
      left: 0; height: 6px; width: 0%;
      background: var(--muted); border-radius: 3px; pointer-events: none;
    }
    .progress-track .loop-region {
      position: absolute; top: 50%; transform: translateY(-50%);
      height: 6px; background: rgba(68,136,255,.45); pointer-events: none;
    }
    .handle {
      position: absolute; top: 50%; transform: translate(-50%,-50%);
      width: 14px; height: 22px; border-radius: 4px;
      cursor: ew-resize; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; color: #fff;
    }
    .handle-a { background: var(--accent); }
    .handle-b { background: var(--accent2); }
    .playhead {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: #fff; pointer-events: none; z-index: 3;
      transform: translateX(-50%);
    }

    /* ── Controls ── */
    .controls {
      width: 100%; max-width: 800px;
      display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
    }

    .time-group { display: flex; flex-direction: column; gap: 4px; }
    .time-group label {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    }
    .time-input-row { display: flex; align-items: center; gap: 6px; }
    .time-input-row input[type="number"] {
      width: 80px; padding: 7px 10px;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: .95rem;
      outline: none; transition: border-color .2s; -moz-appearance: textfield;
    }
    .time-input-row input[type="number"]::-webkit-inner-spin-button,
    .time-input-row input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .time-input-row input[type="number"]:focus { border-color: var(--accent2); }
    .time-input-row .set-btn {
      padding: 7px 11px; border-radius: var(--radius); border: none;
      font-size: .78rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .set-btn-a { background: var(--accent);  color: #fff; }
    .set-btn-b { background: var(--accent2); color: #fff; }
    .set-btn:hover { opacity: .8; }

    .speed-group { display: flex; flex-direction: column; gap: 4px; }
    .speed-group label {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    }
    .speed-group select {
      padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: .9rem;
      outline: none; cursor: pointer;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .ctrl-btn {
      padding: 9px 16px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-size: .88rem; cursor: pointer;
      transition: background .15s, border-color .15s;
      display: flex; align-items: center; gap: 6px;
    }
    .ctrl-btn:hover { background: #262626; border-color: #444; }
    .ctrl-btn.active  { background: var(--accent);  border-color: var(--accent);  color: #fff; }
    .ctrl-btn.active2 { background: var(--accent2); border-color: var(--accent2); color: #fff; }

    .spacer { flex: 1; }

    /* ── Status row ── */
    .status-row {
      width: 100%; max-width: 800px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: .82rem; color: var(--muted);
    }
    #time-display { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--text); }

    /* ── Keyboard hint ── */
    .hint { color: var(--muted); font-size: .76rem; max-width: 800px; width: 100%; line-height: 1.8; }
    .hint kbd {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      border: 1px solid #444; background: #222; font-size: .74rem; font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>YT <span>Looper</span></h1>

  <!-- URL input -->
  <div class="url-row">
    <input id="yt-url" type="text" placeholder="Paste a YouTube URL or video ID…" />
    <button id="load-btn">Load</button>
  </div>

  <!-- YouTube iframe embed target -->
  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <!-- Audio mode artwork panel (hidden in video mode) -->
  <div id="audio-panel">
    <div id="audio-thumb-ph">🎵</div>
    <img id="audio-thumb" alt="thumbnail" style="display:none" />
    <div class="audio-info">
      <div id="audio-title">No video loaded</div>
      <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </div>

  <!-- Timeline / progress bar -->
  <div class="progress-section">
    <div class="progress-track" id="progress-track">
      <div class="track-bg"></div>
      <div class="track-played" id="track-played"></div>
      <div class="loop-region"  id="loop-region"></div>
      <div class="handle handle-a" id="handle-a" title="Loop start (A)">A</div>
      <div class="handle handle-b" id="handle-b" title="Loop end (B)">B</div>
      <div class="playhead" id="playhead"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="time-group">
      <label>Loop In (A)</label>
      <div class="time-input-row">
        <input type="number" id="in-time"  min="0" step="0.1" value="0" />
        <button class="set-btn set-btn-a" id="set-a">Set A</button>
      </div>
    </div>

    <div class="time-group">
      <label>Loop Out (B)</label>
      <div class="time-input-row">
        <input type="number" id="out-time" min="0" step="0.1" value="10" />
        <button class="set-btn set-btn-b" id="set-b">Set B</button>
      </div>
    </div>

    <div class="speed-group">
      <label>Speed</label>
      <select id="speed-select">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </div>

    <div class="spacer"></div>

    <div class="btn-group">
      <button class="ctrl-btn" id="play-pause-btn">▶ Play</button>
      <button class="ctrl-btn active" id="loop-toggle">↺ Loop ON</button>
      <button class="ctrl-btn" id="jump-a-btn">⏮ Jump A</button>
      <button class="ctrl-btn" id="mode-toggle" title="Toggle audio-only mode">🎵 Audio mode</button>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-row">
    <span id="time-display">0.0 s</span>
    <span id="loop-status">Loop: 0.0 s → 10.0 s &nbsp;|&nbsp; Δ 10.0 s</span>
  </div>

  <!-- Keyboard hints -->
  <div class="hint">
    <kbd>Space</kbd> play/pause &nbsp;
    <kbd>A</kbd> set loop-in &nbsp;
    <kbd>B</kbd> set loop-out &nbsp;
    <kbd>L</kbd> toggle loop &nbsp;
    <kbd>J</kbd> jump to A &nbsp;
    <kbd>M</kbd> toggle audio mode &nbsp;
    <kbd>←</kbd>/<kbd>→</kbd> ±0.1 s &nbsp;
    <kbd>Shift+←/→</kbd> ±1 s
  </div>

<script>
/* ─────────────────────────────────────────────
   YouTube IFrame API bootstrap
───────────────────────────────────────────── */
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

let player      = null;
let duration    = 0;
let loopActive  = true;
let loopIn      = 0;
let loopOut     = 10;
let polling     = null;
let isDragging  = false;
let dragTarget  = null;   // 'a' | 'b' | 'seek'
let audioMode   = false;
let currentVideoId = '';

/* ─────────────────────────────────────────────
   Helpers
───────────────────────────────────────────── */
function fmt(s) {
  s = parseFloat(s);
  if (isNaN(s)) return '0.0';
  const sign = s < 0 ? '-' : '';
  s = Math.abs(s);
  const m = Math.floor(s / 60);
  const sec = (s - m * 60).toFixed(1);
  return m > 0 ? `${sign}${m}:${sec.padStart(4, '0')}` : `${sign}${sec}`;
}

function extractVideoId(raw) {
  raw = raw.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) return raw;
  try {
    const url = new URL(raw.includes('://') ? raw : 'https://' + raw);
    if (url.hostname.includes('youtu.be')) return url.pathname.slice(1).split('?')[0];
    return url.searchParams.get('v') || null;
  } catch { return null; }
}

/* ─────────────────────────────────────────────
   IFrame API ready
───────────────────────────────────────────── */
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: '',
    playerVars: {
      autoplay: 0, controls: 0, rel: 0,
      modestbranding: 1, iv_load_policy: 3, fs: 0, disablekb: 1,
    },
    events: { onReady: onPlayerReady, onStateChange: onStateChange }
  });
};

function onPlayerReady() { startPolling(); }

function onStateChange(e) {
  const s = e.data;
  if (s === YT.PlayerState.PLAYING) {
    duration = player.getDuration() || duration;
    playPauseBtn.textContent = '⏸ Pause';
    waveformEl.classList.add('playing');
  } else {
    playPauseBtn.textContent = '▶ Play';
    waveformEl.classList.remove('playing');
  }
  if (s === YT.PlayerState.ENDED && loopActive) seekTo(loopIn);
}

/* ─────────────────────────────────────────────
   Polling
───────────────────────────────────────────── */
function startPolling() {
  if (polling) clearInterval(polling);
  polling = setInterval(tick, 100);
}

function tick() {
  if (!player || typeof player.getCurrentTime !== 'function') return;
  const t = player.getCurrentTime();
  duration = player.getDuration() || duration;
  updateProgressUI(t);
  if (loopActive && player.getPlayerState() === YT.PlayerState.PLAYING && t >= loopOut) {
    seekTo(loopIn);
  }
}

function seekTo(t) {
  if (!player) return;
  player.seekTo(Math.max(0, Math.min(t, duration || t)), true);
}

/* ─────────────────────────────────────────────
   Progress UI
───────────────────────────────────────────── */
const trackEl    = document.getElementById('progress-track');
const playedEl   = document.getElementById('track-played');
const loopRegion = document.getElementById('loop-region');
const handleA    = document.getElementById('handle-a');
const handleB    = document.getElementById('handle-b');
const playheadEl = document.getElementById('playhead');
const timeDisplay = document.getElementById('time-display');
const loopStatus  = document.getElementById('loop-status');
const waveformEl  = document.getElementById('waveform');

function updateProgressUI(t) {
  if (!duration) return;
  const pct = t / duration * 100;
  playheadEl.style.left = pct + '%';
  playedEl.style.width  = pct + '%';
  timeDisplay.textContent = fmt(t) + ' s';

  const aP = loopIn  / duration * 100;
  const bP = loopOut / duration * 100;
  handleA.style.left = aP + '%';
  handleB.style.left = bP + '%';
  loopRegion.style.left  = aP + '%';
  loopRegion.style.width = (bP - aP) + '%';

  loopStatus.textContent =
    `Loop: ${fmt(loopIn)} s → ${fmt(loopOut)} s \u00a0|\u00a0 Δ ${fmt(loopOut - loopIn)} s`;
}

function syncHandlesFromInputs() {
  const a = parseFloat(document.getElementById('in-time').value)  || 0;
  const b = parseFloat(document.getElementById('out-time').value) || 0;
  if (a >= b) return;
  loopIn  = a;
  loopOut = b;
  updateProgressUI(player ? player.getCurrentTime() : 0);
}

/* ─────────────────────────────────────────────
   Drag / seek on the track
───────────────────────────────────────────── */
function clientXToTime(cx) {
  const r = trackEl.getBoundingClientRect();
  return Math.max(0, Math.min(1, (cx - r.left) / r.width)) * (duration || 100);
}

function startDrag(target) {
  isDragging = true; dragTarget = target;
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup',   onDragEnd);
  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend',  onDragEnd);
}

function onDragMove(e) {
  if (!isDragging) return;
  e.preventDefault();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const t  = clientXToTime(cx);
  if (dragTarget === 'a') {
    loopIn = Math.max(0, Math.min(t, loopOut - 0.1));
    document.getElementById('in-time').value = loopIn.toFixed(1);
  } else if (dragTarget === 'b') {
    loopOut = Math.max(loopIn + 0.1, Math.min(t, duration || 9999));
    document.getElementById('out-time').value = loopOut.toFixed(1);
  } else {
    seekTo(t);
  }
  updateProgressUI(player ? player.getCurrentTime() : 0);
}

function onDragEnd() {
  isDragging = false; dragTarget = null;
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup',   onDragEnd);
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend',  onDragEnd);
}

handleA.addEventListener('mousedown',  e => { e.stopPropagation(); startDrag('a'); });
handleA.addEventListener('touchstart', e => { e.stopPropagation(); startDrag('a'); }, { passive: true });
handleB.addEventListener('mousedown',  e => { e.stopPropagation(); startDrag('b'); });
handleB.addEventListener('touchstart', e => { e.stopPropagation(); startDrag('b'); }, { passive: true });

trackEl.addEventListener('mousedown', e => { seekTo(clientXToTime(e.clientX)); startDrag('seek'); });
trackEl.addEventListener('touchstart', e => {
  seekTo(clientXToTime(e.touches[0].clientX)); startDrag('seek');
}, { passive: true });

/* ─────────────────────────────────────────────
   Audio mode toggle
───────────────────────────────────────────── */
const playerWrap  = document.getElementById('player-wrap');
const audioPanel  = document.getElementById('audio-panel');
const audioThumb  = document.getElementById('audio-thumb');
const audioThumbPh = document.getElementById('audio-thumb-ph');
const audioTitle  = document.getElementById('audio-title');
const modeToggle  = document.getElementById('mode-toggle');

function setAudioMode(on) {
  audioMode = on;
  playerWrap.classList.toggle('audio-mode', on);
  audioPanel.classList.toggle('visible', on);
  modeToggle.classList.toggle('active2', on);
  modeToggle.textContent = on ? '📹 Video mode' : '🎵 Audio mode';

  // When switching to audio mode, mute the player's internal volume is NOT what we want —
  // we want sound. Instead we simply hide the video visually. The iframe keeps running at
  // 1 px height so the audio stream continues uninterrupted.
  if (on && currentVideoId) {
    // Load thumbnail
    const url = `https://i.ytimg.com/vi/${currentVideoId}/mqdefault.jpg`;
    audioThumb.src = url;
    audioThumb.onload = () => { audioThumb.style.display = 'block'; audioThumbPh.style.display = 'none'; };
    audioThumb.onerror = () => { audioThumb.style.display = 'none'; audioThumbPh.style.display = 'flex'; };
  } else {
    audioThumb.style.display = 'none';
    audioThumbPh.style.display = 'flex';
  }
}

modeToggle.addEventListener('click', () => setAudioMode(!audioMode));

/* ─────────────────────────────────────────────
   Transport buttons
───────────────────────────────────────────── */
const playPauseBtn = document.getElementById('play-pause-btn');
const loopToggle   = document.getElementById('loop-toggle');
const jumpABtn     = document.getElementById('jump-a-btn');

playPauseBtn.addEventListener('click', () => {
  if (!player) return;
  player.getPlayerState() === YT.PlayerState.PLAYING
    ? player.pauseVideo() : player.playVideo();
});

loopToggle.addEventListener('click', () => {
  loopActive = !loopActive;
  loopToggle.textContent = loopActive ? '↺ Loop ON' : '↺ Loop OFF';
  loopToggle.classList.toggle('active', loopActive);
});

jumpABtn.addEventListener('click', () => seekTo(loopIn));

document.getElementById('set-a').addEventListener('click', () => {
  if (!player) return;
  const t = parseFloat(player.getCurrentTime().toFixed(1));
  loopIn = Math.min(t, loopOut - 0.1);
  document.getElementById('in-time').value = loopIn.toFixed(1);
  updateProgressUI(t);
});

document.getElementById('set-b').addEventListener('click', () => {
  if (!player) return;
  const t = parseFloat(player.getCurrentTime().toFixed(1));
  loopOut = Math.max(t, loopIn + 0.1);
  document.getElementById('out-time').value = loopOut.toFixed(1);
  updateProgressUI(t);
});

document.getElementById('in-time').addEventListener('change',  syncHandlesFromInputs);
document.getElementById('out-time').addEventListener('change', syncHandlesFromInputs);

document.getElementById('speed-select').addEventListener('change', e => {
  if (player && player.setPlaybackRate) player.setPlaybackRate(parseFloat(e.target.value));
});

/* ─────────────────────────────────────────────
   Load video
───────────────────────────────────────────── */
document.getElementById('load-btn').addEventListener('click', loadVideo);
document.getElementById('yt-url').addEventListener('keydown', e => { if (e.key === 'Enter') loadVideo(); });

function loadVideo() {
  const raw = document.getElementById('yt-url').value;
  const vid = extractVideoId(raw);
  if (!vid) { alert('Could not extract a YouTube video ID from that URL.'); return; }
  if (!player || typeof player.loadVideoById !== 'function') {
    alert('Player not ready yet — please wait a moment.'); return;
  }
  currentVideoId = vid;
  audioTitle.textContent = 'Loading…';
  player.loadVideoById({ videoId: vid, startSeconds: loopIn });
  duration = 0;

  // Fetch oEmbed for the video title (no API key needed)
  fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${vid}&format=json`)
    .then(r => r.json())
    .then(d => { audioTitle.textContent = d.title || vid; })
    .catch(() => { audioTitle.textContent = vid; });

  // Refresh thumbnail if already in audio mode
  if (audioMode) setAudioMode(true);
}

/* ─────────────────────────────────────────────
   Keyboard shortcuts
───────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  switch (e.key) {
    case ' ': case 'k': e.preventDefault(); playPauseBtn.click(); break;
    case 'a': case 'A': document.getElementById('set-a').click(); break;
    case 'b': case 'B': document.getElementById('set-b').click(); break;
    case 'l': case 'L': loopToggle.click(); break;
    case 'j': case 'J': seekTo(loopIn); break;
    case 'm': case 'M': setAudioMode(!audioMode); break;
    case 'ArrowLeft': {
      e.preventDefault();
      if (player) seekTo(player.getCurrentTime() - (e.shiftKey ? 1 : 0.1)); break;
    }
    case 'ArrowRight': {
      e.preventDefault();
      if (player) seekTo(player.getCurrentTime() + (e.shiftKey ? 1 : 0.1)); break;
    }
  }
});
</script>
